name: Bug report
description: Something in Callie isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the week of ...
        2. ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Output of `callie doctor`, or "Copy debug info" from the ? menu in the app. Email addresses
        are already masked. Check it for anything else you would rather not share.
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: For anything visual. Drag images in here.
