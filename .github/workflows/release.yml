name: Release

# A pushed vX.Y.Z tag publishes a release: the source tarball, .deb and .rpm
# packages, and the notes from CHANGELOG.md. Pull requests that touch packaging,
# and runs started by hand, build the same files without publishing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - packaging/**
      - scripts/check-version.sh
      - scripts/release-notes.sh
      - tests/package_smoke.sh
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check every file names that version
        run: scripts/check-version.sh "${{ steps.version.outputs.version }}"

      - name: Write the notes and the source tarball
        run: |
          version="${{ steps.version.outputs.version }}"
          scripts/release-notes.sh "$version" > notes.md
          git archive --prefix="callie-$version/" HEAD | xz -9 > "callie-$version.tar.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            notes.md
            callie-*.tar.xz
          if-no-files-found: error

  rpm:
    needs: source
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source

      - name: Build the package
        # The Google OAuth client lets the packaged app sign in. A release
        # without one fails to build rather than ship an app that cannot.
        env:
          CALLIE_GOOGLE_CLIENT_ID: ${{ secrets.CALLIE_GOOGLE_CLIENT_ID }}
          CALLIE_GOOGLE_CLIENT_SECRET: ${{ secrets.CALLIE_GOOGLE_CLIENT_SECRET }}
          CALLIE_MICROSOFT_CLIENT_ID: ${{ secrets.CALLIE_MICROSOFT_CLIENT_ID }}
          CALLIE_REQUIRE_GOOGLE_CLIENT: ${{ github.ref_type == 'tag' && '1' || '' }}
        run: |
          version="${{ needs.source.outputs.version }}"
          dnf install -y --setopt=install_weak_deps=False rpm-build dnf-plugins-core xz tar
          tar -xf "callie-$version.tar.xz"
          dnf builddep -y "callie-$version/packaging/rpm/callie.spec"
          mkdir -p rpmbuild/SOURCES
          cp "callie-$version.tar.xz" rpmbuild/SOURCES/
          rpmbuild -ba --define "_topdir $PWD/rpmbuild" "callie-$version/packaging/rpm/callie.spec"

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: |
            rpmbuild/RPMS/*/*.rpm
            rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  deb:
    needs: source
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source

      - name: Build the package
        # As for the rpm.
        env:
          CALLIE_GOOGLE_CLIENT_ID: ${{ secrets.CALLIE_GOOGLE_CLIENT_ID }}
          CALLIE_GOOGLE_CLIENT_SECRET: ${{ secrets.CALLIE_GOOGLE_CLIENT_SECRET }}
          CALLIE_MICROSOFT_CLIENT_ID: ${{ secrets.CALLIE_MICROSOFT_CLIENT_ID }}
          CALLIE_REQUIRE_GOOGLE_CLIENT: ${{ github.ref_type == 'tag' && '1' || '' }}
        run: |
          version="${{ needs.source.outputs.version }}"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts equivs xz-utils
          tar -xf "callie-$version.tar.xz"
          cp "callie-$version.tar.xz" "callie_$version.orig.tar.xz"
          cd "callie-$version"
          cp -r packaging/debian debian
          mk-build-deps --install --remove \
            --tool "apt-get -y --no-install-recommends" debian/control
          dpkg-buildpackage -us -uc -b

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: "*.deb"
          if-no-files-found: error

  # The AUR's PKGBUILD, built against this source. Arch moves quickly, so a
  # failure here does not hold back the release.
  arch:
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: source

      - name: Build the package
        run: |
          version="${{ needs.source.outputs.version }}"
          pacman -Syu --noconfirm --needed base-devel
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir /build
          cp packaging/arch/callie/PKGBUILD "callie-$version.tar.xz" /build/
          sum="$(sha256sum "callie-$version.tar.xz" | cut -d' ' -f1)"
          # The release's own tarball, which makepkg finds beside the PKGBUILD.
          sed -i -e "s/^pkgver=.*/pkgver=$version/" \
            -e "0,/^sha256sums=('[0-9a-f]*'/s//sha256sums=('$sum'/" /build/PKGBUILD
          chown -R builder /build
          cd /build
          sudo -u builder makepkg --syncdeps --noconfirm

  # Each package installed on a clean system, and run, before it is published.
  installed:
    needs: [rpm, deb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:44
            package: rpm
          - name: debian
            image: debian:trixie
            package: deb
    name: installed (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: packages

      - name: Install the package (Fedora)
        if: matrix.name == 'fedora'
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          $(find packages/RPMS -name 'callie-[0-9]*.rpm')

      # The offscreen platform the check draws with is not one a desktop needs.
      - name: Install the package (Debian)
        if: matrix.name == 'debian'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-qpa-plugins ./packages/callie_*.deb

      - name: Run what was installed
        run: tests/package_smoke.sh shots

      - uses: actions/upload-artifact@v4
        with:
          name: installed-${{ matrix.name }}
          path: shots/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [source, rpm, deb, installed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Callie ${{ needs.source.outputs.version }}" \
            --notes-file dist/notes.md \
            dist/callie-*.tar.xz $(find dist -name '*.deb' -o -name '*.rpm')

      - name: Update the package repositories on the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
