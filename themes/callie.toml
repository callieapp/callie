# Callie, the default theme. Every other theme inherits whatever it leaves out
# from this file, so it sets every key.

[theme]
name = "Callie"
variant = "dark"

[colors]
background = "#1c1220"
surface = "#261a2a"
surface-alt = "#33243a"
hairline = "#2c2031"
border = "#3d2c42"
text = "#f6eef5"
text-muted = "#c9b7c6"
text-faint = "#9a8797"
accent = "#f08fb8"
accent-text = "#2e0f20"
danger = "#e66e6d"
edge = "#140c17"
accent-edge = "#a64b7a"

# Calendar colors keep their hue and become pastel stickers: a fill, dark ink on
# it and a deeper edge under it. Lightness and chroma are OKLCH.
[calendar]
harmonize = true
lightness = 0.86
chroma = 0.073
ink-lightness = 0.27
ink-chroma = 0.06
edge-lightness = 0.6
edge-chroma = 0.095

[shape]
radius-small = 6
radius = 11
radius-large = 14
radius-xlarge = 16
sticker-edge = 3

[shadow]
color = "#000000"
opacity = 0.5
blur = 36
offset = 14

# Nunito and Fraunces ship with Callie. Empty means the system font.
[type]
family = "Nunito"
display-family = "Fraunces"
mono-family = ""

# Durations in milliseconds. Bounce is the overshoot when something arrives;
# 0 turns it off.
[motion]
duration-fast = 140
duration = 200
duration-slow = 280
bounce = 1.2
