# Minimal Dark: Minimal's plain look on near-black, with calendars as deep fills
# under light text. Anything not set here comes
# from callie.toml.

[theme]
name = "Minimal Dark"
variant = "dark"

[colors]
background = "#18181b"
surface = "#1f1f23"
surface-alt = "#27272a"
hairline = "#232327"
border = "#3f3f46"
text = "#f4f4f5"
text-muted = "#a1a1aa"
text-faint = "#8b8b94"
accent = "#60a5fa"
accent-text = "#0b1220"
danger = "#f87171"
edge = "#0f0f11"
accent-edge = "#2563eb"

[calendar]
lightness = 0.42
chroma = 0.08
ink-lightness = 0.95
ink-chroma = 0.02
edge-lightness = 0.32
edge-chroma = 0.07

[shape]
radius-small = 4
radius = 6
radius-large = 8
radius-xlarge = 10
sticker-edge = 0

[shadow]
color = "#000000"
opacity = 0.4
blur = 24
offset = 8

[type]
family = ""
display-family = ""

[motion]
bounce = 0
