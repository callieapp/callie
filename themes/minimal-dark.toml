# Minimal Dark: Minimal after Google Calendar's dark look, with calendars as
# soft fills under dark text. Anything not set here comes from callie.toml.

[theme]
name = "Minimal Dark"
variant = "dark"

[colors]
background = "#131314"
surface = "#1e1f20"
surface-alt = "#282a2c"
hairline = "#2d2f31"
border = "#444746"
text = "#e3e3e3"
text-muted = "#c4c7c5"
text-faint = "#8e918f"
accent = "#a8c7fa"
accent-text = "#062e6f"
danger = "#f2b8b5"
edge = "#0e0e0f"
accent-edge = "#7cacf8"

[calendar]
lightness = 0.76
chroma = 0.1
ink-lightness = 0.2
ink-chroma = 0.03
edge-lightness = 0.6
edge-chroma = 0.09

[shape]
radius-small = 4
radius = 6
radius-large = 8
radius-xlarge = 12
sticker-edge = 0

[shadow]
color = "#000000"
opacity = 0.5
blur = 16
offset = 4

[type]
family = ""
display-family = ""
weight-strong = 500
weight-bold = 500
weight-heavy = 600

[motion]
bounce = 0
