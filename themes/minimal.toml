# Minimal: plain greys, light calendar tints, the system font, flat buttons and
# no bounce. Anything not set here comes from callie.toml.

[theme]
name = "Minimal"
variant = "light"

[colors]
background = "#f6f6f7"
surface = "#ffffff"
surface-alt = "#eeeef0"
hairline = "#e7e7ea"
border = "#d4d4d8"
text = "#18181b"
text-muted = "#52525b"
text-faint = "#71717a"
accent = "#2563eb"
accent-text = "#ffffff"
danger = "#c81e1e"
edge = "#d4d4d8"
accent-edge = "#1d4ed8"

[calendar]
lightness = 0.9
chroma = 0.06
ink-lightness = 0.3
ink-chroma = 0.06
edge-lightness = 0.75
edge-chroma = 0.07

[shape]
radius-small = 4
radius = 6
radius-large = 8
radius-xlarge = 10
sticker-edge = 0

[shadow]
color = "#000000"
opacity = 0.1
blur = 24
offset = 8

[type]
family = ""
display-family = ""

[motion]
bounce = 0
